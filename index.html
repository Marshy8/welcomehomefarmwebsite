<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Icons and og-image.jpg are drawn by scripts/make-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the cream header, so a phone's toolbar blends into it. -->
    <meta name="theme-color" content="#f7f2e7" />
    <title>Welcome Home Farm - Bentonville, Arkansas</title>
    <meta
      name="description"
      content="Welcome Home Farm grows seasonal vegetables and native fruits for U-Pick, CSA and educational experiences in Bentonville, Arkansas."
    />
    <!-- Link previews need absolute URLs, so these name the domain. -->
    <meta property="og:title" content="Welcome Home Farm - Bentonville, Arkansas" />
    <meta
      property="og:description"
      content="Stay close to Home. Veg local. Pick native. U-Pick, CSA and group events in Bentonville."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://welcomehomefarm.org/" />
    <meta property="og:image" content="https://welcomehomefarm.org/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Welcome Home Farm, Bentonville, Arkansas, beside a ground cherry in its husk on the vine"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
